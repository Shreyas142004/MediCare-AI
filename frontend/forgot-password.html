<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - MediCare AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">✚</span>
        <span>MediCare<span style="color:var(--secondary)">AI</span></span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn-outline btn btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="feature-icon icon-amber" style="margin:0 auto 1rem;">🔒</div>
        <h2>Reset Password</h2>
        <p class="text-muted">Enter your registered email address to receive a 6-digit verification code</p>
      </div>

      <form id="forgot-password-form">
        <div class="form-group">
          <label class="form-label" for="email">Registered Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <button type="submit" class="btn-block btn btn-primary btn-lg" style="margin-top:1.5rem;">
          Send Verification Code
        </button>
      </form>

      <div class="auth-footer">
        Remembered your password? <a href="login.html" class="font-semibold">Back to sign in</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
