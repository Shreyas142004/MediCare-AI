<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP - MediCare AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">✚</span>
        <span>MediCare<span style="color:var(--secondary)">AI</span></span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn-outline btn btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="feature-icon icon-purple" style="margin:0 auto 1rem;">✉️</div>
        <h2>Enter Verification Code</h2>
        <p class="text-muted">Enter the 6-digit OTP code sent to your email</p>
      </div>

      <div id="demo-otp-hint" style="display:none; background:var(--primary-bg); border:1px solid #bfdbfe; border-radius:var(--radius-md); padding:0.75rem; margin-bottom:1.25rem; font-size:0.85rem; color:var(--primary-dark); text-align:center;">
      </div>

      <form id="verify-otp-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" readonly style="background:#f1f5f9;">
        </div>

        <div class="form-group">
          <label class="form-label" for="otp">6-Digit Verification Code</label>
          <input type="text" id="otp" class="form-control" placeholder="123456" maxlength="8" required style="letter-spacing: 4px; font-size: 1.25rem; text-align: center; font-weight: bold;">
          <span class="form-text">Valid for 15 minutes.</span>
        </div>

        <button type="submit" class="btn-block btn btn-primary btn-lg" style="margin-top:1.5rem;">
          Verify Code
        </button>
      </form>

      <div class="auth-footer">
        Didn't receive a code? <a href="forgot-password.html" class="font-semibold">Resend OTP</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
