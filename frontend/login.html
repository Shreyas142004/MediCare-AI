<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - MediCare AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">✚</span>
        <span>MediCare<span style="color:var(--secondary)">AI</span></span>
      </a>
      <div class="nav-actions">
        <a href="register.html" class="btn-outline btn btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="feature-icon icon-blue" style="margin:0 auto 1rem;">🔑</div>
        <h2>Welcome Back</h2>
        <p class="text-muted">Sign in to access your dashboard and medicine scan history</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
            <label class="form-label" for="password" style="margin:0;">Password</label>
            <a href="forgot-password.html" style="font-size:0.82rem;">Forgot password?</a>
          </div>
          <div class="input-password-wrap">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn-block btn btn-primary btn-lg" style="margin-top:1.5rem;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="register.html" class="font-semibold">Create one for free</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
