<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - MediCare AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">✚</span>
        <span>MediCare<span style="color:var(--secondary)">AI</span></span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn-outline btn btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="feature-icon icon-green" style="margin:0 auto 1rem;">🛡️</div>
        <h2>Create New Password</h2>
        <p class="text-muted">Enter and confirm your new secure account password</p>
      </div>

      <form id="reset-password-form">
        <input type="hidden" id="email">
        <input type="hidden" id="otp">

        <div class="form-group">
          <label class="form-label" for="new_password">New Password</label>
          <div class="input-password-wrap">
            <input type="password" id="new_password" class="form-control" placeholder="At least 6 characters" required autocomplete="new-password">
          </div>
          <span class="form-text">Must be at least 6 characters long.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm New Password</label>
          <div class="input-password-wrap">
            <input type="password" id="confirm_password" class="form-control" placeholder="Re-enter new password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn-block btn btn-primary btn-lg" style="margin-top:1.5rem;">
          Reset Password & Sign In
        </button>
      </form>

      <div class="auth-footer">
        Return to <a href="login.html" class="font-semibold">Sign In</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
